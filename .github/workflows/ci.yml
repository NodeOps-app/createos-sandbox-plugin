# Hermetic checks: no CreateOS account, no API key, no sandboxes, no quota. That is what
# lets this run on fork PRs, where secrets are not available, and what keeps it honest as a
# merge gate — a red build here is always the code, never the platform.
#
# End-to-end tests are deliberately absent. They provision real sandboxes against a CreateOS
# account, so they cost quota per run, cannot work on forks, and go red for reasons that have
# nothing to do with the diff. They live outside this repository.
#
# ci.jenkins.io builds this plugin from the Jenkinsfile once the repository is hosted in the
# jenkinsci organization. This workflow overlaps with it on purpose: it is the only gate that
# runs before hosting, and it gives fork PRs a check without needing ci.jenkins.io access.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A force-push should not leave the previous run burning a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the floor implied by pom's jenkins.version (2.541.3 supports 17, 21 or 25).
        # 25 is the newest version the current LTS lines accept. Both must compile.
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # `verify`, not `package`: the POM binds Spotless and Checkstyle to lifecycle phases,
      # and CI must run the same gate contributors run locally.
      - name: Build, test, format check and Checkstyle
        run: mvn -B -ntp clean verify

      - name: Upload plugin
        if: matrix.java == '21' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: createos-sandbox
          path: target/*.hpi
          if-no-files-found: error
